name: Run nf-test
# Default suite only. tests/meridian_integration.nf.test (real MERIDIAN container, ~12 min, 9 GB
# image) is ignored by nf-test.config and run on demand, see its header.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nf-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NXF_ANSI_LOG: false
      NFT_VER: "0.9.5"
      NXF_VER: "26.04.7"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (container images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ env.NXF_VER }}

      - uses: nf-core/setup-nf-test@v2
        with:
          version: ${{ env.NFT_VER }}

      - name: Run nf-test
        run: nf-test test --profile docker,test --ci --verbose
