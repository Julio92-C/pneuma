report_comment: >
  This report has been generated by the <a href="https://github.com/Julio92-C/pneuma/tree/dev" target="_blank">Julio92-C/pneuma</a>
  analysis pipeline. Sections follow the pipeline flow: read QC, host removal, taxonomy,
  contamination, functional annotation. For how to interpret them, see
  <a href="https://github.com/Julio92-C/pneuma/blob/dev/docs/output.md" target="_blank">docs/output.md</a>.

# Higher order = higher on the page. Flow: QC -> host removal -> taxonomy -> contamination -> functional.
report_section_order:
  "Julio92-C-pneuma-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "Julio92-C-pneuma-summary":
    order: -1002
  general_stats:
    order: 1000
  # 1. read QC
  nanostat:
    order: 900
  seqkit:
    order: 880
  porechop:
    order: 870
  nanoq:
    order: 860
  # 2. host removal
  hostile:
    order: 800
  # 3. taxonomy
  kraken:
    order: 700
  bracken:
    order: 690
  # 4. contamination
  recentrifuge_stats:
    order: 600
  # 5. functional
  abricate_hits:
    order: 500

export_plots: true

disable_version_detection: true

# Make the sample names of all modules identical to the samplesheet `sample` column
fn_clean_exts:
  - ".kraken2.report_bracken"
  - ".kraken2.report"
  - ".kraken2.classifiedreads"
  - ".hostile.fastq"
  - ".hostile"
  - ".nanoq"
  - ".NanoStats"
  - ".stats"
  - ".porechop_abi"
  - "_abricate"
  - type: remove
    pattern: ".fastq.gz"

# Kraken2 and Bracken both write Kraken-style reports; show them as two sections
top_modules:
  - "kraken":
      name: "Kraken2"
      anchor: "kraken"
      path_filters:
        - "*.kraken2.report.txt"
  - "kraken":
      name: "Bracken"
      anchor: "bracken"
      target: "Bracken"
      doi: "10.7717/peerj-cs.104"
      info: "re-estimates species abundances from the Kraken2 classification."
      extra: |
        The title of the plot says Kraken2 because the first Bracken step writes the same
        report format; the abundance estimates themselves are in taxonomy/bracken/.
      path_filters:
        - "*.kraken2.report_bracken.txt"
