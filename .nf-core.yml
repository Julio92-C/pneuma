repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-pneuma_logo_light.png
    - docs/images/nf-core-pneuma_logo_light.png
    - docs/images/nf-core-pneuma_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
    - docs/CONTRIBUTING.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-pneuma_logo_light.png
    - docs/images/nf-core-pneuma_logo_light.png
    - docs/images/nf-core-pneuma_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: Julio92-C
  name: pneuma
  description: "Long-read metagenomics of respiratory samples \u2014 QC, host removal,\
    \ taxonomy, contamination, AMR/VF/MGE, priority-pathogen reconstruction and MERIDIAN\
    \ cohort analysis"
  author: Julio Cesar Ortega Cambara
  version: 0.1.1
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - gitpod
    - codespaces
    - seqera_platform
    - adaptivecard
    - slackreport
    - rocrate
  is_nfcore: false
