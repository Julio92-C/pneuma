<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 610" width="1400" height="610" role="img" font-family="Helvetica, Arial, sans-serif">
<title>PNEUMA pipeline metro map</title>
<desc>Tube-map overview of the PNEUMA pipeline in six stage columns. A blue QC and host removal trunk (cat, Porechop_ABI, nanoq, NanoPlot, SeqKit stats, Hostile) reaches the Kraken2 interchange, which branches into Abundance (Bracken, KrakenTools combine, Krona), Contamination (Recentrifuge, negative-control aware) and Functional profiling (Tag reads, ABRicate with CARD, VFDB and PlasmidFinder). The three tracks converge on the MERIDIAN interchange and the Report. A grey dashed planned line (assembly, CheckM2, Bakta, MLST, Pathogen report) also leaves Kraken2. A thin MultiQC bus along the bottom collects QC, Kraken2/Bracken, Recentrifuge and ABRicate outputs into the QC report. Reference databases are built with --build_databases or supplied with --db_dir.</desc>
