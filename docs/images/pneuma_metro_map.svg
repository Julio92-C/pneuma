<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 460" width="1300" height="460" role="img" font-family="Helvetica, Arial, sans-serif">
<title>PNEUMA pipeline metro map</title>
<desc>Tube-map overview of the PNEUMA pipeline. A blue QC and host removal trunk (cat, Porechop_ABI, nanoq, NanoPlot, SeqKit stats, Hostile) reaches the Kraken2 interchange which branches into Abundance (Bracken, KrakenTools combine, Krona), Contamination (Recentrifuge), Functional profiling (Tag reads, ABRicate, CARD, VFDB, PlasmidFinder) and a planned Metagenome reconstruction line. The first three merge at MERIDIAN for downstream analysis and the Report. A short spur just before MERIDIAN ends at MultiQC (report of all steps); filled stops mark the stations whose output it reports.</desc>
