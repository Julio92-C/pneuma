<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 486" width="1380" height="486" role="img" font-family="Helvetica, Arial, sans-serif">
<title>PNEUMA pipeline metro map</title>
<desc>Tube-map overview of the PNEUMA pipeline. A blue QC and host removal trunk (cat, Porechop_ABI, nanoq, NanoPlot, SeqKit stats, Hostile) reaches the Kraken2 interchange which branches into Abundance (Bracken, KrakenTools combine, Krona), Contamination (Recentrifuge), Functional profiling (Tag reads, ABRicate, CARD, VFDB, PlasmidFinder) and a Pathogen reconstruction line. The first three end at a vertical junction interchange, from which the downstream line (MERIDIAN, then the Report) and a grey exit to MultiQC (report of all steps) leave; filled stops mark the stations whose output MultiQC reports. The pathogen line is an opt-in line that runs per sample and panel species: read extraction, a coverage gate (with patient-level pooling when no sample passes), Flye and Medaka, CheckM2 and QUAST, skani species confirmation, MLST, AMRFinderPlus, ABRicate and Bakta (MOB-suite optional), ending in the Pathogen report; QUAST, CheckM2 and the pathogen status are reported in MultiQC.</desc>
