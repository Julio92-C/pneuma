<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" font-family="Helvetica, Arial, sans-serif">
<title>PNEUMA module card: Functional profiling</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect x="1" y="1" width="1098" height="358" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<rect x="24" y="22" width="10" height="28" rx="3" fill="#9B3FA8"/>
<text x="44" y="43" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">Functional profiling</text>
<text x="134" y="80" font-size="10" font-weight="700" fill="#57606a" text-anchor="middle">INPUTS</text>
<text x="550" y="80" font-size="10" font-weight="700" fill="#57606a" text-anchor="middle">STEPS</text>
<text x="966" y="80" font-size="10" font-weight="700" fill="#57606a" text-anchor="middle">OUTPUTS</text>
<rect x="24" y="110" width="220" height="40" rx="20" fill="#ffffff" stroke="#9B3FA8" stroke-width="2"/>
<text x="134" y="134" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">Kraken2-classified reads</text>
<line x1="244" y1="130" x2="296" y2="133" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M24,172 v28 a110,6 0 0 0 220,0 v-28" fill="#ffffff" stroke="#9B3FA8" stroke-width="2"/>
<ellipse cx="134" cy="172" rx="110" ry="6" fill="#ffffff" stroke="#9B3FA8" stroke-width="2"/>
<text x="134" y="190" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">CARD · VFDB · PlasmidFinder</text>
<line x1="244" y1="186" x2="296" y2="133" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="800" y="103" font-size="11" font-weight="400" fill="#9B3FA8" text-anchor="end" font-style="italic">taxid written into the read id</text>
<rect x="300" y="110" width="500" height="46" rx="8" fill="#ffffff" stroke="#9B3FA8" stroke-width="2.5"/>
<text x="312" y="129" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start">Tag reads</text>
<text x="312" y="147" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">which Kraken2 taxon does each read carry?</text>
<text x="312" y="172" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" font-style="italic">blind spot: one taxon per read, also for a read that carries a plasmid</text>
<line x1="340" y1="180" x2="340" y2="207" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="800" y="203" font-size="11" font-weight="400" fill="#9B3FA8" text-anchor="end" font-style="italic">--abricate_minid 80 · --abricate_mincov 80</text>
<rect x="300" y="210" width="500" height="46" rx="8" fill="#ffffff" stroke="#9B3FA8" stroke-width="2.5"/>
<text x="312" y="229" font-size="13" font-weight="700" fill="#1f2328" text-anchor="start">ABRicate</text>
<text x="312" y="247" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">which ARG, VF and replicon genes are on each read?</text>
<text x="312" y="272" font-size="11" font-weight="400" fill="#57606a" text-anchor="start" font-style="italic">blind spot: known genes only; CARD variant models: mutation not checked</text>
<line x1="800" y1="233" x2="852" y2="205" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="856" y="185" width="220" height="40" fill="#ffffff" stroke="#9B3FA8" stroke-width="2"/>
<rect x="856" y="185" width="220" height="8" fill="#9B3FA8"/>
<text x="966" y="212" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">&lt;sample&gt;_abricate.csv</text>
<line x1="800" y1="233" x2="852" y2="261" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="856" y="241" width="220" height="40" fill="#ffffff" stroke="#9B3FA8" stroke-width="2"/>
<rect x="856" y="241" width="220" height="8" fill="#9B3FA8"/>
<text x="966" y="268" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">summary_reportClean.csv</text>
<text x="24" y="342" font-size="11" font-weight="400" fill="#57606a" text-anchor="start">Inputs and outputs: reads = pill, sequences = parallelogram, table = banded box, database = cylinder. Dashed step = optional (off by default).</text>
</svg>
